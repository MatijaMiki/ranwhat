name: tests

# The README says the local tools "ship and are tested". Until this ran on
# every push, that meant tested on whichever laptop last ran them.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows fails the build like any other runner. Until it had passed once
    # it was continue-on-error, and a run read green while sixteen tests
    # failed there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # No install step: there are no dependencies, and the tests import the
      # package from the checkout.
      - run: python -m unittest discover -s tests -v

  worker:
    name: Contact Worker parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Both files are ES modules with no package.json saying so. Node 22
      # detects that; the runner's default Node may not.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --check worker/src/index.js && node --check worker/src/list.js && node --check worker/src/feed.js && node --check worker/src/auth.js && node --check worker/src/stripe.js && node --check worker/src/accounts.js && node --check worker/src/session.js && node --check worker/src/dashboard.js && node --check worker/src/ui.js && node --check functions/_middleware.js
      # The release list and the feed end to end, over node:sqlite (Node
      # 22.13 and later). The feed test runs the real `ranwhat update`
      # against the Worker, so it needs the Python the runner comes with.
      - run: node --test worker/test/list.test.mjs worker/test/feed.test.mjs worker/test/auth.test.mjs worker/test/stripe.test.mjs worker/test/accounts.test.mjs
