name: tests

# The README says the local tools "ship and are tested". Until this ran on
# every push, that meant tested on whichever laptop last ran them.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows fails the build like any other runner. Until it had passed once
    # it was continue-on-error, and a run read green while sixteen tests
    # failed there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # No install step: there are no dependencies, and the tests import the
      # package from the checkout.
      - run: python -m unittest discover -s tests -v

  worker:
    name: Contact Worker parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Both files are ES modules with no package.json saying so. Node 22
      # detects that; the runner's default Node may not.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --check worker/src/index.js && node --check worker/src/list.js && node --check worker/src/feed.js && node --check worker/src/auth.js && node --check worker/src/stripe.js && node --check worker/src/accounts.js && node --check worker/src/session.js && node --check worker/src/dashboard.js && node --check worker/src/ui.js && node --check worker/src/features.js && node --check worker/src/password.js && node --check worker/src/challenge.js && node --check worker/src/oauth.js && node --check worker/src/webauthn.js && node --check worker/src/passkeys.js && node --check worker/src/device.js && node --check worker/src/machines.js && node --check worker/src/billing.js && node --check worker/src/members.js && node --check functions/_middleware.js
      # The release list and the feed end to end, over node:sqlite (Node
      # 22.13 and later). The feed test runs the real `ranwhat update`
      # against the Worker, so it needs the Python the runner comes with.
      - run: node --test worker/test/list.test.mjs worker/test/feed.test.mjs worker/test/auth.test.mjs worker/test/stripe.test.mjs worker/test/accounts.test.mjs worker/test/plans.test.mjs worker/test/password.test.mjs worker/test/oauth.test.mjs worker/test/webauthn.test.mjs worker/test/passkeys.test.mjs worker/test/device.test.mjs worker/test/machines.test.mjs worker/test/billing.test.mjs worker/test/members.test.mjs worker/test/stripe_probe.test.mjs

  action:
    name: The GitHub Action fails on findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # One Claude Code transcript with one high action in it: rm -rf on
      # a directory under the home directory.
      - run: |
          python3 - "$RUNNER_TEMP/projects/-tmp-proj" <<'PY'
          import json, os, sys, time
          os.makedirs(sys.argv[1])
          when = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          row = {"timestamp": when, "message": {"role": "assistant", "content": [
              {"type": "tool_use", "id": "t1", "name": "Bash",
               "input": {"command": "rm -rf ~/Documents/archive"}}]}}
          with open(os.path.join(sys.argv[1], "s1.jsonl"), "w") as fh:
              fh.write(json.dumps(row) + "\n")
          PY
      - id: high
        uses: ./
        continue-on-error: true
        with:
          fail-on: high
          upload-sarif: "false"
          args: --source claude-code --root ${{ runner.temp }}/projects
      - id: critical
        uses: ./
        with:
          fail-on: critical
          upload-sarif: "false"
          sarif-file: critical.sarif
          args: --source claude-code --root ${{ runner.temp }}/projects
      - env:
          HIGH_OUTCOME: ${{ steps.high.outcome }}
          HIGH_CODE: ${{ steps.high.outputs.exit-code }}
          CRITICAL_CODE: ${{ steps.critical.outputs.exit-code }}
        run: |
          test "$HIGH_OUTCOME" = failure
          test "$HIGH_CODE" = 3
          test "$CRITICAL_CODE" = 0
          python3 -c "import json; r = json.load(open('ranwhat.sarif'))['runs'][0]['results']; assert [x['ruleId'] for x in r] == ['fs.destructive'], r"
