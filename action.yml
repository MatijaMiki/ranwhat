# The Marketplace name must not match a GitHub account, and the account
# "ranwhat" is taken, so the listing carries a longer name.
name: ranwhat agent audit
description: >-
  Audit what AI coding agents ran in a CI job and the secrets left in their
  history. Fails on findings, uploads SARIF.
author: Matija Mikulinec
branding:
  icon: shield
  color: gray-dark

# Runs ranwhat from this action's own checkout, with the runner's Python
# (3.9 or newer): no dependency is installed and nothing is fetched from
# PyPI, so the code that runs is the code at the ref the workflow pins.
# Nothing goes online but the SARIF upload to this repository's code
# scanning, by GitHub's own upload-sarif action.

inputs:
  command:
    description: check, watch or clean. clean never masks here; it reports.
    required: false
    default: check
  fail-on:
    description: >-
      Fail the step when anything at or above this severity is found:
      medium, high or critical (every secret clean finds is critical).
      Empty to never fail on findings.
    required: false
    default: high
  days:
    description: How far back to read each agent's history, in days.
    required: false
    default: "30"
  args:
    description: >-
      More flags for ranwhat, such as --source claude-code or
      --path codex=~/.codex. Split on spaces.
    required: false
    default: ""
  sarif-file:
    description: Where to write the SARIF log.
    required: false
    default: ranwhat.sarif
  upload-sarif:
    description: >-
      Upload the SARIF log to code scanning. Needs the job's
      security-events write permission.
    required: false
    default: "true"
  sarif-category:
    description: The code scanning category for the upload.
    required: false
    default: ranwhat
  allow-empty:
    description: >-
      Pass when there is no agent history to read (ranwhat's exit status
      2). Off by default, so a step pointed at the wrong place says so.
    required: false
    default: "false"
  ignore-file:
    description: >-
      A file in this repository, such as .ranwhatignore, of actions to leave
      out (ranwhat ignore). Read as committed at the pull request's base, or
      before the push, never as the job left it. Empty: nothing is left out,
      and the runner's own ~/.ranwhat/ignore is never read.
    required: false
    default: ""

outputs:
  exit-code:
    description: >-
      ranwhat's exit status: 0 nothing at or above fail-on, 1 an error
      (a flag ranwhat refused too), 2 no agent history to read, 3 findings
      at or above fail-on.
    value: ${{ steps.run.outputs.exit-code }}
  sarif-file:
    description: The SARIF log written.
    value: ${{ steps.run.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      # Inputs reach the script only through the environment, never
      # through ${{ }} in its text, so none is read as shell.
      env:
        RANWHAT_ACTION_PATH: ${{ github.action_path }}
        RANWHAT_COMMAND: ${{ inputs.command }}
        RANWHAT_FAIL_ON: ${{ inputs.fail-on }}
        RANWHAT_DAYS: ${{ inputs.days }}
        RANWHAT_ARGS: ${{ inputs.args }}
        RANWHAT_SARIF: ${{ inputs.sarif-file }}
        RANWHAT_IGNORE: ${{ inputs.ignore-file }}
        RANWHAT_IGNORE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        RANWHAT_NO_HINTS: "1"
      run: |
        case "$RANWHAT_COMMAND" in
          check|watch|clean) ;;
          *) echo "::error::command must be check, watch or clean, not '$RANWHAT_COMMAND'"; exit 1 ;;
        esac
        case "$RANWHAT_FAIL_ON" in
          ""|medium|high|critical) ;;
          *) echo "::error::fail-on must be medium, high, critical or empty, not '$RANWHAT_FAIL_ON'"; exit 1 ;;
        esac
        case "$RANWHAT_DAYS" in
          ""|*[!0-9]*|0) echo "::error::days must be a whole number of days, not '$RANWHAT_DAYS'"; exit 1 ;;
        esac
        # One left by an earlier step is not this run's.
        rm -f -- "$RANWHAT_SARIF"
        python=python3
        command -v "$python" >/dev/null 2>&1 || python=python
        argv=("$RANWHAT_COMMAND" --days "$RANWHAT_DAYS" --sarif "$RANWHAT_SARIF")
        if [ "$RANWHAT_COMMAND" = clean ]; then argv+=(--no-interactive); fi
        if [ -n "$RANWHAT_FAIL_ON" ]; then argv+=(--fail-on "$RANWHAT_FAIL_ON"); fi
        # check and watch always get --ignore, of a file made here: empty,
        # or ignore-file as it was committed at the pull request's base or
        # before the push. A step earlier in the job, an agent's among
        # them, cannot widen it, and the runner's ~/.ranwhat/ignore is
        # never read. mktemp's name is new, so nothing planted at a fixed
        # name in RUNNER_TEMP is followed. Before args, so --ignore there,
        # which comes later, wins.
        if [ "$RANWHAT_COMMAND" != clean ]; then
          ignore_file=$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ranwhat-ignore.XXXXXX")
          # What reports call that file: a name to print, never a place.
          export RANWHAT_IGNORE_LABEL="no ignore file" RANWHAT_IGNORE_LABEL_FILE="$ignore_file"
          if [ -n "$RANWHAT_IGNORE" ]; then
            case "$RANWHAT_IGNORE" in
              /*|-*|*..*) echo "::error::ignore-file must be a path inside the repository, not '$RANWHAT_IGNORE'"; exit 1 ;;
            esac
            ws="${GITHUB_WORKSPACE:-$PWD}"; ref="$RANWHAT_IGNORE_REF"
            case "$ref" in ""|*[!0-9a-f]*|0000000000000000000000000000000000000000) ref="${GITHUB_SHA:-HEAD}" ;; esac
            git -C "$ws" cat-file -e "$ref^{commit}" 2>/dev/null \
              || git -C "$ws" fetch --quiet --no-tags --depth=1 origin "$ref" 2>/dev/null || true
            if git -C "$ws" show "$ref:$RANWHAT_IGNORE" > "$ignore_file" 2>/dev/null; then
              export RANWHAT_IGNORE_LABEL="$RANWHAT_IGNORE at ${ref:0:12}"
              # Line endings are not a change: Git for Windows checks out
              # CRLF, the blob has LF, and a warning that fires on every
              # windows-latest run teaches nobody to read it.
              if [ -f "$ws/$RANWHAT_IGNORE" ] && ! cmp -s <(tr -d '\r' < "$ignore_file") <(tr -d '\r' < "$ws/$RANWHAT_IGNORE"); then
                echo "::warning::$RANWHAT_IGNORE was changed after ${ref:0:12}; ranwhat uses it as it was there, not as this job left it."
              fi
            else
              : > "$ignore_file"
              echo "::warning::ranwhat could not read $RANWHAT_IGNORE at ${ref:0:12}, so nothing is left out. Check the repository out first (actions/checkout)."
            fi
          fi
          argv+=(--ignore "$ignore_file")
        fi
        read -r -a extra <<< "$RANWHAT_ARGS"
        argv+=("${extra[@]}")
        # -I: neither the workspace nor PYTHONPATH is on the path, so a
        # module the repository holds (a json.py, a ranwhat/) is never run.
        set +e
        "$python" -I -c 'import sys; sys.path.insert(0, sys.argv.pop(1)); from ranwhat.cli import main; sys.exit(main(sys.argv[1:]))' \
          "$RANWHAT_ACTION_PATH" "${argv[@]}" </dev/null
        status=$?
        set -e
        # ranwhat writes the SARIF whenever it gets as far as reading, with
        # no history too. A 2 without it is argparse refusing a flag in
        # args, an error, not "nothing to read".
        if [ "$status" = 2 ] && [ ! -f "$RANWHAT_SARIF" ]; then
          echo "::error::ranwhat refused its arguments; see the usage above."
          status=1
        fi
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        if [ -f "$RANWHAT_SARIF" ]; then
          echo "sarif-file=$RANWHAT_SARIF" >> "$GITHUB_OUTPUT"
        fi

    - if: ${{ inputs.upload-sarif == 'true' && steps.run.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: ${{ inputs.sarif-category }}

    - shell: bash
      env:
        RANWHAT_STATUS: ${{ steps.run.outputs.exit-code }}
        RANWHAT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
      run: |
        case "$RANWHAT_STATUS" in
          0) exit 0 ;;
          2) if [ "$RANWHAT_ALLOW_EMPTY" = true ]; then
               echo "::notice::ranwhat found no agent history to read."
               exit 0
             fi
             echo "::error::ranwhat found no agent history to read. Run it after the agent's steps, in the same job, or point it with args (--root, --path ID=PATH)."
             exit 2 ;;
          3) echo "::error::ranwhat found something at or above the fail-on severity. See the log above, or code scanning."
             exit 3 ;;
          *) echo "::error::ranwhat failed (exit status $RANWHAT_STATUS)."
             exit 1 ;;
        esac
