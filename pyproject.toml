[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ranwhat"
version = "0.4.0"
description = "AI coding agent security for Claude Code: reports risky actions in its transcripts, finds secrets left in them, and scores agent credentials."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Matija Mikulinec" }]
keywords = [
  "ai-security", "ai-agents", "agent-security", "coding-agents", "claude-code",
  "security", "secrets", "secret-scanning", "credentials", "transcripts",
  "audit", "audit-log", "observability", "least-privilege", "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]
# Deliberately empty. This is pointed at your own credentials; a dependency
# tree is something a reviewer has to audit before that is reasonable.
dependencies = []

[project.urls]
Homepage = "https://ranwhat.com"
Documentation = "https://ranwhat.com/install"
Changelog = "https://github.com/MatijaMiki/ranwhat/commits/main"
Source = "https://github.com/MatijaMiki/ranwhat"
Issues = "https://github.com/MatijaMiki/ranwhat/issues"

[project.scripts]
ranwhat = "ranwhat.cli:main"

[tool.setuptools]
packages = ["ranwhat", "ranwhat.sources"]
include-package-data = false

[tool.setuptools.package-data]
ranwhat = ["demo/*.json"]

# Named so `uv publish --index testpypi` resolves. TestPyPI is a separate
# service with its own account and its own tokens; a real release goes to the
# default index and needs no --index at all.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
