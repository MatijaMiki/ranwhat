name = "ranwhat-contact"
main = "src/index.js"
compatibility_date = "2026-09-23"

# Cloudflare will only deliver to addresses already verified under Email
# Routing on this account, so this binding cannot be turned into an open relay
# even if the Worker itself were compromised.
send_email = [
  { name = "CONTACT_EMAIL", destination_address = "ranwhatcom@gmail.com" }
]

# Workers Builds runs `npx wrangler preview` for every branch other than main,
# and that command stops with an error when this block is missing. It is empty
# on purpose: a Preview inherits nothing from production, so a branch build
# gets no email binding, no Turnstile secret and no X token. It cannot send
# mail or report a lead, and Wrangler's warning that CONTACT_EMAIL is not
# configured for Previews is expected. The route below stays production only.
previews = {}

# Takes precedence over the Pages project for this path, so the site and the
# API share one origin and the browser never makes a cross-origin request.
[[routes]]
pattern = "ranwhat.com/api/*"
zone_name = "ranwhat.com"

# The subscription feed (src/feed.js), at the address ranwhat/feed.py asks.
# A route, not a custom domain, so a deploy needs no DNS permission: the
# hostname needs a proxied DNS record of its own (AAAA feed -> 100::).
[[routes]]
pattern = "feed.ranwhat.com/v1/*"
zone_name = "ranwhat.com"

# Accounts, in dashboard.js. A route, as for the feed, so a deploy needs no
# DNS permission: the hostname needs a proxied DNS record of its own
# (AAAA account -> 100::). Until ACCOUNTS_ON is set, every request here
# gets the same 404 as an unknown path. Its forms that mail a code check
# Turnstile with TURNSTILE_SECRET, the contact form's widget: add
# account.ranwhat.com to that widget's hostnames before switching it on,
# or no code can be asked for.
[[routes]]
pattern = "account.ranwhat.com/*"
zone_name = "ranwhat.com"

# TURNSTILE_SECRET, X_PIXEL_TOKEN, RESEND_API_KEY and LIST_SECRET are
# encrypted secrets, set with `npx wrangler secret put <NAME>`, never here.
# RESEND_API_KEY: a Full access key (the list makes contacts, a segment and
# broadcasts, not only emails), for a Resend account with ranwhat.com
# verified. LIST_SECRET signs the confirmation links: 32 characters or more,
# e.g. the output of `openssl rand -base64 32`. Until both are set the
# signup answers that email updates are not switched on yet, and the cron
# sends nothing.
#
# STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET sell Plus (src/stripe.js).
# scripts/stripe_setup.py sets Stripe up and prints the webhook's secret,
# test mode first. Until both are set, with the two above, checkout says it
# is not open yet. LIST_SECRET also derives each subscriber's feed token:
# change it and tokens already issued keep working, but a subscriber's
# welcome page would then show a new one.
#
# ACCOUNT_SECRET keeps account codes, sessions and form tokens (src/session.js):
# 32 characters or more, e.g. `openssl rand -base64 32`, and never the same
# as LIST_SECRET. Accounts also need RESEND_API_KEY and TURNSTILE_SECRET.
# ACCOUNTS_ON = "1" in [vars] below switches them on; until then they are
# dark. Switched on with any of those missing, account.ranwhat.com only says
# accounts are not available.
#
# GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (a Google Cloud OAuth client of
# type Web application), and GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET (a
# GitHub OAuth app), offer "Continue with Google" and "Continue with GitHub"
# (src/oauth.js). Each registers exactly one redirect URI,
# https://account.ranwhat.com/auth/google/callback or
# https://account.ranwhat.com/auth/github/callback. A provider missing either
# of its two is not offered, and its /auth/ paths answer 404.

# The X lead event's ID, from X Events Manager. Not a secret: the same ID is in
# site/consent.js. Remove it and the Worker reports nothing to X.
[vars]
X_EVENT_LEAD = "tw-rfz6t-rfz7z"
# Who answers for VAT on Plus (src/stripe.js). "managed": Stripe's Managed
# Payments, merchant of record, which collects and files it; the account must
# have accepted its terms. "automatic": Stripe Tax calculates it and we file
# it. "off": no tax in checkout. site/terms.html and privacy.html describe
# "managed": change them with it.
STRIPE_TAX = "managed"

# Signups waiting to be confirmed, and which releases went out. No
# database_id on purpose: the first deploy creates the database (Wrangler's
# automatic provisioning, which also works for a deploy from GitHub) and
# list.js creates its tables on first use. D1 and cron triggers are on the
# Workers free plan.
[[d1_databases]]
binding = "LIST"
database_name = "ranwhat-list"

# Reads /rss.xml and sends a new release as one broadcast; also sends the
# confirmation emails the free plan's daily limit held back.
[triggers]
crons = ["7,22,37,52 * * * *"]
