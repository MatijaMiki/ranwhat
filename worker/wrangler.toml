name = "ranwhat-contact"
main = "src/index.js"
compatibility_date = "2026-09-23"

# Cloudflare will only deliver to addresses already verified under Email
# Routing on this account, so this binding cannot be turned into an open relay
# even if the Worker itself were compromised.
send_email = [
  { name = "CONTACT_EMAIL", destination_address = "ranwhatcom@gmail.com" }
]

# Takes precedence over the Pages project for this path, so the site and the
# API share one origin and the browser never makes a cross-origin request.
[[routes]]
pattern = "ranwhat.com/api/*"
zone_name = "ranwhat.com"

# TURNSTILE_SECRET and X_PIXEL_TOKEN are encrypted secrets, set with
# `npx wrangler secret put <NAME>`, never here.

# The X lead event's ID, from X Events Manager. Not a secret: the same ID is in
# site/consent.js. Leave it unset and the Worker reports nothing to X.
# [vars]
# X_EVENT_LEAD = "tw-rfz6t-xxxxx"
